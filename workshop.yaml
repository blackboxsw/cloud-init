name: cloud-init
base: ubuntu@26.04
sdks:
  - name: vscode-remote
    plugs:
      git-dir:
        interface: mount
        workshop-target: "/home/chad.smith@canonical.com/projects/cloud-init/.git"
  - name: uv
  - name: project-cloud-init-dev
actions:
  test: |
    cd /project
    tox -e py3 "$@"
  test-fast: |
    cd /project
    tox -e py3-fast "$@"
  lint: |
    cd /project
    tox -e check_format "$@"
  format: |
    cd /project
    tox -e do_format "$@"
  mypy: |
    cd /project
    tox -e mypy "$@"
  docs: |
    cd /project
    tox -e doc "$@"
