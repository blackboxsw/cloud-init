<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud-init Integration Test Dashboard</title>
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript>
<p>This dashboard requires JavaScript. The raw data is available at
<a href="data/index.json">data/index.json</a>,
<a href="data/tests.json">data/tests.json</a>,
and <a href="data/summary.json">data/summary.json</a>.</p>
</noscript>
<header>
<h1>Cloud-init Integration Test Dashboard</h1>
<div id="health-strip"></div>
</header>
<section id="controls">
<input type="text" id="filter-input" placeholder="Filter by test name (regex)..." autocomplete="off">
<div id="platform-chips"></div>
<div id="release-chips"></div>
<select id="window-select">
<option value="7">7 days</option>
<option value="30" selected>30 days</option>
<option value="90">90 days</option>
<option value="all">All</option>
</select>
<select id="sort-select">
<option value="flakiness" selected>Sort: Flakiness</option>
<option value="fail">Sort: Fail count</option>
<option value="rate">Sort: Success rate</option>
<option value="name">Sort: Name</option>
</select>
<label><input type="checkbox" id="only-flaky"> Only flaky</label>
<label><input type="checkbox" id="only-failing"> Only failing</label>
<label><input type="checkbox" id="include-manual"> Include manual</label>
<label><input type="checkbox" id="group-params"> Merge params</label>
</section>
<section id="worst-offenders"></section>
<section id="table-container">
<table id="results-table">
<thead><tr id="table-head"></tr></thead>
<tbody id="table-body"></tbody>
</table>
<div id="load-more-container" style="display:none">
<button id="load-more">Load more rows</button>
</div>
</section>
<div id="detail-drawer" style="display:none">
<div id="detail-content"></div>
<button id="detail-close">Close</button>
</div>
<footer>
<p>Generated by <code>tools/integration_dashboard.py</code>.</p>
</footer>
<script src="app.js"></script>
</body>
</html>
